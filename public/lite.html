<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0d0d">
<meta name="referrer" content="no-referrer">
<title>Device Monitor</title>
<!-- The lite dashboard, for low-end tablets and phones (about 1 GB of memory, slow CPU, old browser).
     It polls a small summary instead of holding the live stream, draws no charts, animates nothing
     and only touches the page where a number changed. The script is plain ES5 on purpose. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0d0d0d; color: #f0efec; font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; padding: 10px 14px; border-bottom: 1px solid #2a2a28; }
  header > * { margin: 2px 12px 2px 0; }
  header b { font-size: 16px; }
  #status { color: #c3c2b7; font-size: 13px; }
  .grow { flex: 1; margin: 0; }
  header a, header button, header select { font: inherit; font-size: 13px; color: #f0efec; background: #232321; border: 1px solid #3a3a37; border-radius: 8px; padding: 6px 10px; text-decoration: none; }
  header button.on { background: #9085e9; border-color: #9085e9; color: #0b0b0b; }
  main { display: flex; flex-wrap: wrap; padding: 8px; }
  .dev { flex: 1 1 260px; min-width: 0; margin: 6px; padding: 12px 14px; background: #1a1a19; border: 1px solid #2a2a28; border-radius: 12px; }
  @supports (display: grid) {
    main { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  }
  .head { display: flex; align-items: baseline; margin-bottom: 8px; }
  .name { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name:before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: #0ca30c; vertical-align: 1px; }
  .off .name:before { background: #898781; }
  .sub { color: #898781; font-size: 12px; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row { display: flex; align-items: center; height: 26px; }
  .k { width: 42px; color: #c3c2b7; font-size: 13px; }
  .bar { flex: 1; height: 8px; background: #2c2c2a; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; }
  .cpu i { background: #3987e5; } .gpu i { background: #d95926; } .mem i { background: #199e70; }
  .v { width: 54px; text-align: right; font-weight: 600; }
  .t { width: 74px; text-align: right; color: #c3c2b7; font-size: 13px; white-space: nowrap; }
  .t.warm { color: #fab219; } .t.hot { color: #e66767; }
  .foot { margin-top: 6px; color: #898781; font-size: 12px; min-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .off { opacity: .55; }
  .off .row, .off .foot { display: none; }
  .empty { margin: 30px auto; color: #898781; text-align: center; }
</style>
</head>
<body>
<header>
  <b>Device Monitor</b>
  <span id="status">Connecting…</span>
  <span class="grow"></span>
  <select id="every" title="How often to refresh" aria-label="Refresh interval">
    <option value="5">Every 5 s</option><option value="15">Every 15 s</option><option value="60">Every minute</option>
  </select>
  <button id="unit" title="Temperature unit">°C</button>
  <button id="awake" hidden>Keep screen on</button>
  <a id="full" href="/">Full dashboard</a>
</header>
<main id="list"></main>
<script>
(function () {
  'use strict';
  function stored(area, k) { try { return window[area].getItem(k); } catch (e) { return null; } }
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var token = stored('sessionStorage', 'dm.session');
  if (!token) { location.replace('/unlock'); return; }
  function byId(id) { return document.getElementById(id); }
  var list = byId('list'), statusEl = byId('status');
  var unit = stored('localStorage', 'unit') === 'F' ? 'F' : 'C';
  var every = +stored('localStorage', 'dm.lite.every'); if (every !== 15 && every !== 60) every = 5;
  var cards = {}, order = null, timer = null, busy = false, last = null;

  // ---- formatting ----
  function bytes(b) {
    if (b == null || isNaN(b)) return '–';
    var u = ['B', 'KB', 'MB', 'GB', 'TB'], i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return b.toFixed(i < 2 || b >= 100 ? 0 : 1) + ' ' + u[i];
  }
  function pct(v) { return v == null ? '–' : Math.round(v) + '%'; }
  function temp(c) { return c == null ? '' : unit === 'F' ? Math.round(c * 9 / 5 + 32) + '°F' : Math.round(c) + '°C'; }
  function heat(c) { return c == null || c < 70 ? 't' : c < 85 ? 't warm' : 't hot'; }
  function span(s) {
    var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    return d ? d + 'd ' + h + 'h' : h ? h + 'h ' + m + 'm' : m + 'm';
  }
  function ago(ms) { return !ms ? 'never' : Date.now() - ms < 60000 ? 'just now' : span((Date.now() - ms) / 1000) + ' ago'; }

  // ---- one card per device, built once; later updates only write what changed ----
  function el(tag, cls, parent) { var e = document.createElement(tag); if (cls) e.className = cls; if (parent) parent.appendChild(e); return e; }
  function text(node, s) { if (node.dmText !== s) { node.dmText = s; node.textContent = s; } }
  function cls(node, s) { if (node.dmCls !== s) { node.dmCls = s; node.className = s; } }
  function width(node, v) {
    var w = v == null ? '0' : Math.max(0, Math.min(100, Math.round(v))) + '%';
    if (node.dmW !== w) { node.dmW = w; node.style.width = w; }
  }
  function row(card, kind, label) {
    var r = el('div', 'row', card), out = { row: r };
    text(el('span', 'k', r), label);
    out.fill = el('i', '', el('div', 'bar ' + kind, r));
    out.v = el('span', 'v', r); out.t = el('span', 't', r);
    return out;
  }
  function create(id) {
    var card = el('section', 'dev'), c = { el: card };
    c.name = el('div', 'name', el('div', 'head', card));
    c.sub = el('div', 'sub', card);
    c.cpu = row(card, 'cpu', 'CPU'); c.gpu = row(card, 'gpu', 'GPU'); c.mem = row(card, 'mem', 'Mem');
    c.foot = el('div', 'foot', card);
    return (cards[id] = c);
  }
  function update(d) {
    var c = cards[d.id] || create(d.id);
    cls(c.el, d.online ? 'dev' : 'dev off');
    text(c.name, d.name || d.id);
    text(c.sub, (d.os ? d.os + ' · ' : '') + (d.online ? (d.uptime ? 'up ' + span(d.uptime) : 'online') : 'offline · last seen ' + ago(d.lastSeen)));
    if (!d.online) return;
    width(c.cpu.fill, d.cpu); text(c.cpu.v, (d.cpuEstimated && d.cpu != null ? '~' : '') + pct(d.cpu));
    text(c.cpu.t, temp(d.cpuTemp)); cls(c.cpu.t, heat(d.cpuTemp));
    var hasGpu = d.gpu !== undefined;
    if (c.gpu.shown !== hasGpu) { c.gpu.shown = hasGpu; c.gpu.row.style.display = hasGpu ? '' : 'none'; }
    if (hasGpu) { width(c.gpu.fill, d.gpu); text(c.gpu.v, pct(d.gpu)); text(c.gpu.t, temp(d.gpuTemp)); cls(c.gpu.t, heat(d.gpuTemp)); }
    var mem = d.memTotal ? d.memUsed / d.memTotal * 100 : null;
    width(c.mem.fill, mem); text(c.mem.v, pct(mem)); text(c.mem.t, d.memTotal ? bytes(d.memTotal) : '');
    var foot = [];
    if (d.rx != null) foot.push('↓ ' + bytes(d.rx) + '/s  ↑ ' + bytes(d.tx) + '/s');
    if (d.watts != null) foot.push(Math.round(d.watts) + ' W');
    if (d.battery) foot.push('Battery ' + Math.round(d.battery.percent) + '%' + (d.battery.charging ? ' (charging)' : ''));
    text(c.foot, foot.join('  ·  '));
  }
  function render(devices) {
    last = devices;
    devices.sort(function (a, b) {
      if (a.online !== b.online) return a.online ? -1 : 1;
      var ao = a.order == null ? 1e9 : a.order, bo = b.order == null ? 1e9 : b.order;
      return ao - bo || String(a.name || '').localeCompare(String(b.name || ''));
    });
    var seen = {}, ids = [], on = 0, i;
    for (i = 0; i < devices.length; i++) { update(devices[i]); seen[devices[i].id] = 1; ids.push(devices[i].id); if (devices[i].online) on++; }
    for (var id in cards) if (!seen[id]) { if (cards[id].el.parentNode) list.removeChild(cards[id].el); delete cards[id]; }
    var key = ids.join('\n');
    if (key !== order) {   // only when a device came, went or changed place
      order = key;
      while (list.firstChild) list.removeChild(list.firstChild);
      for (i = 0; i < ids.length; i++) list.appendChild(cards[ids[i]].el);
      if (!ids.length) text(el('p', 'empty', list), 'No devices yet. Add them from the hub.');
    }
    text(statusEl, devices.length ? on + ' of ' + devices.length + ' online' : '');
  }

  // ---- polling: one small request per interval, and none while the page is hidden ----
  function signedOut() { try { sessionStorage.removeItem('dm.session'); } catch (e) {} location.replace('/unlock'); }
  function failed() { busy = false; text(statusEl, 'Reconnecting to hub…'); }
  function poll() {
    if (busy) return;
    busy = true;
    var x = new XMLHttpRequest();
    x.open('GET', '/api/summary');
    x.setRequestHeader('Authorization', 'Bearer ' + token);
    x.timeout = 12000;
    x.onload = function () {
      if (x.status === 401) return signedOut();
      var body = null;
      if (x.status === 200) { try { body = JSON.parse(x.responseText); } catch (e) {} }
      if (!body || !body.devices || typeof body.devices.length !== 'number') return failed();
      busy = false; render(body.devices);
    };
    x.onerror = x.ontimeout = x.onabort = failed;
    x.send();
  }
  function tick() { if (!document.hidden) poll(); timer = setTimeout(tick, every * 1000); }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { poll(); keepAwake(); } });

  // ---- controls ----
  var everySel = byId('every'), unitBtn = byId('unit'), awakeBtn = byId('awake');
  everySel.value = String(every);
  everySel.onchange = function () { every = +everySel.value || 5; store('dm.lite.every', String(every)); clearTimeout(timer); tick(); };
  unitBtn.textContent = '°' + unit;
  unitBtn.onclick = function () { unit = unit === 'C' ? 'F' : 'C'; store('unit', unit); unitBtn.textContent = '°' + unit; if (last) render(last); };
  byId('full').onclick = function () { store('dm.view', 'full'); };
  store('dm.view', 'lite');   // signing in on this device opens the lite dashboard from now on

  // Wall-mounted tablets: stop the screen from sleeping while this page is showing (where the browser can).
  var awake = stored('localStorage', 'dm.lite.awake') === '1', lock = null;
  function keepAwake() {
    if (!navigator.wakeLock) return;
    cls(awakeBtn, awake ? 'on' : '');
    if (!awake) { if (lock) { lock.release(); lock = null; } return; }
    if (lock || document.hidden) return;
    navigator.wakeLock.request('screen').then(function (l) {
      lock = l; l.addEventListener('release', function () { lock = null; });
    }, function () {});
  }
  if (navigator.wakeLock) {
    awakeBtn.hidden = false;
    awakeBtn.onclick = function () { awake = !awake; store('dm.lite.awake', awake ? '1' : '0'); keepAwake(); };
    keepAwake();
  }
  tick();
})();
</script>
</body>
</html>
